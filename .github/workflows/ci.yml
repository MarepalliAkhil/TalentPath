name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talentpath
          POSTGRES_PASSWORD: talentpath
          POSTGRES_DB: talentpath
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talentpath"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DATABASE_URL: postgres://talentpath:talentpath@localhost:5432/talentpath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Migrations match models
        run: python manage.py makemigrations --check --dry-run
      - name: Fairness proof (counterfactual and structural)
        run: pytest tests/test_fairness.py
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (exactly what package-lock.json pins)
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
